<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Planika</title><meta name="robots" content="noindex">
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8e7; color: #1a1033; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 440px; margin: 24px; padding: 26px 24px; background: #ffd23f; border: 3px solid #1a1033; border-radius: 18px; box-shadow: 6px 6px 0 #1a1033; }
h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.15; }
p { margin: 0 0 18px; }
a { display: inline-block; padding: 10px 18px; background: #fff; color: inherit; font-weight: 800; text-decoration: none; border: 2.5px solid #1a1033; border-radius: 999px; box-shadow: 3px 3px 0 #1a1033; }
</style></head><body>
<main><h1 id="t">Aquí no hay nada</h1>
<p id="m">La página que buscas no existe o ha cambiado de sitio.</p>
<a id="home" href="/">Ver los planes de hoy</a></main>
<script>
// En GitHub Pages sin dominio propio la web cuelga de /<repositorio>/
var base = /\.github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
document.getElementById('home').href = base;
if (/\/e\/[^/]*\.html$/.test(location.pathname)) {
  document.getElementById('t').textContent = 'Este plan ya ha pasado';
  document.getElementById('m').textContent = 'El plan que buscas ya se ha celebrado o el organizador lo ha retirado de su agenda.';
}
</script>
</body></html>
