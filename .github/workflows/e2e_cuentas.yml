name: Prueba de cuentas contra Supabase (rama sondeo, no desplegar)
on:
  push:
    branches: [sondeo]
    paths: ["tools/sondeo/e2e_cuentas.py", ".github/workflows/e2e_cuentas.yml"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: cuentas-supabase
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Construir la web de la rama
        run: cd app && python3 fetch_events.py --rebuild 2>&1 | tail -2 && test -f site/data/core.js
      - name: Prueba
        run: |
          (cd app/site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          python3 tools/sondeo/e2e_cuentas.py
        env:
          E2E_EMAIL: e2e-e9731bfe@planikaapp.invalid
          E2E_PW: L6_DL0TDh5Fi8C9M2XL4jDQV
