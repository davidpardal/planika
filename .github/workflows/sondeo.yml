name: Sondeo de fuentes (rama de pruebas, no desplegar)
on:
  push:
    branches: [sondeo]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python3 tools/sondeo/dump.py
