name: Sondeo de fuentes (rama de pruebas, no desplegar)
on:
  push:
    branches: [sondeo]
    paths: ["tools/sondeo/dump.py", ".github/workflows/sondeo.yml"]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python3 tools/sondeo/probe3.py tools/sondeo/urls_sur2.txt
