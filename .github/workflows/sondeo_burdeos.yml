name: Sondeo Burdeos (rama sondeo, no desplegar)
on:
  push:
    branches: [sondeo]
    paths: [".github/workflows/sondeo_burdeos.yml"]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: burdeos-espanol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from planes import src_burdeos as s
          evs = s.fetch(print)
          es = [e for e in evs if e.get("title_es")]
          same = [e for e in evs if not e.get("title_es")]
          print("RES total=%d con_titulo_es=%d sin=%d" % (len(evs), len(es), len(same)))
          for e in same: print("SIN", e["title"][:80])
          for e in evs:
              print("JSONLINE " + json.dumps(e, ensure_ascii=True).replace("::", ": :"))
          PY
