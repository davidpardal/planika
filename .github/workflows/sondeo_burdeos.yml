name: Sondeo Burdeos (rama sondeo, no desplegar)
on:
  push:
    branches: [sondeo]
    paths: [".github/workflows/sondeo_burdeos.yml"]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          import json, sys
          from datetime import timedelta
          sys.path.insert(0, ".")
          from planes import src_burdeos as s
          from planes.util import http_json, strip_html
          a, b = s.WINDOW[0] - timedelta(days=1), s.WINDOW[1] + timedelta(days=1)
          where = "firstdate_begin <= '%sT23:59:59' and lastdate_end >= '%s'" % (b.isoformat(), a.isoformat())
          rows = http_json(s.API, params={"where": where, "lang": "fr"})
          seen = set()
          for r in rows:
              if not s.to_events([r]) or r["uid"] in seen:
                  continue
              seen.add(r["uid"])
              desc = strip_html(r.get("description_fr") or r.get("longdescription_fr") or "", 260)
              line = json.dumps({"u": r["uid"], "t": strip_html(r["title_fr"], 200), "d": desc, "p": s.price_fr(r.get("conditions_fr"))[0]}, ensure_ascii=True)
              print("ROW " + line.replace("::", ": :"))
          print("TOTAL", len(seen))
          PY
