name: Sondeo Burdeos (rama sondeo, no desplegar)
on:
  push:
    branches: [sondeo]
    paths: [".github/workflows/sondeo_burdeos.yml"]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: burdeos-diciembre
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          import collections, json, sys
          sys.path.insert(0, ".")
          from planes import src_burdeos as s
          evs = s.fetch(print)
          json.dump(evs, open("burdeos.json", "w"), ensure_ascii=False)
          C = collections.Counter
          print("CAT", C(e["category"] for e in evs).most_common())
          print("CITY", C(e["city"] for e in evs).most_common(8))
          print("DAYS", C((e["start"], e["end"]) for e in evs).most_common(12))
          print("FREE", sum(1 for e in evs if e["free"]), "NOCOORD", sum(1 for e in evs if e["lat"] is None))
          for e in sorted(evs, key=lambda e: (e["start"], e["time"]))[:400]:
              print("EV | %s | %s-%s %s | %s | %s | %s | %s | %s" % (e["category"], e["start"][5:], e["end"][5:], e["time"], e["title"][:55], (e["venue"] or "")[:28], e["city"], (e["price"] or "")[:25], e["url"][:60]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: burdeos
          path: burdeos.json
