name: Actualizar planes y publicar

on:
  schedule:
    - cron: "15 4 * * *"   # todos los días a las 04:15 UTC
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: planika-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pruebas
        run: python3 -m unittest discover -s tests -v
      # La web vive en el dominio propio: canónicas y sitemap usan siempre esa dirección
      - id: pages
        uses: actions/configure-pages@v5
      - name: Descargar agendas
        env:
          PLANIKA_SITE_URL: https://planikaapp.com
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLANIKA_LLM: ${{ vars.PLANIKA_LLM || 'off' }}
        run: python3 fetch_events.py --days 180
      - name: Guardar datos actualizados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Se conservan los archivos generados, se sincroniza con la rama remota y se vuelven a aplicar:
          # así no hay conflictos aunque otra ejecución haya publicado datos mientras tanto.
          tar cf /tmp/generado.tar $(ls -d site/data site/feeds site/p site/t site/sitemap.xml site/robots.txt data/health.json data/teams_cache.json data/llm_cache.json 2>/dev/null)
          git fetch origin main
          git reset --hard origin/main
          tar xf /tmp/generado.tar
          git add -A site/ data/
          git commit -m "Actualiza eventos $(date -u +%F)" || echo "sin cambios"
          git push origin HEAD:main
      - name: Avisar si alguna fuente falla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > alerts.txt
          import json, sys; h = json.load(open("data/health.json")); a = h.get("alerts", [])
          sys.stdout.write("\n".join("- " + x for x in a) + ("\n" if a else ""))
          PY
          if [ -s alerts.txt ]; then
            title="Alerta de fuentes $(date -u +%F)"
            if [ -z "$(gh issue list --state open --json number,title --jq '.[] | select(.title|startswith("Alerta de fuentes")) | .number')" ]; then
              gh issue create --title "$title" --body "$(printf 'Fuentes con menos eventos de lo normal o con error:\n\n%s\n\nRevisa data/health.json y el log del workflow.' "$(cat alerts.txt)")"
            else
              echo "Ya hay una alerta abierta; no se duplica."
            fi
          else
            for n in $(gh issue list --state open --json number,title --jq '.[] | select(.title|startswith("Alerta de fuentes")) | .number'); do
              gh issue close "$n" --comment "Todas las fuentes han respondido con normalidad en la ejecución de $(date -u +%F)."
            done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
