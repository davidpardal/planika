name: Actualizar planes y publicar

on:
  schedule:
    - cron: "15 4 * * *"   # todos los días a las 04:15 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pruebas
        run: python3 -m unittest discover -s tests -v
      - name: Descargar agendas
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLANIKA_LLM: ${{ vars.PLANIKA_LLM || 'off' }}
        run: python3 fetch_events.py --days 180
      - name: Guardar datos actualizados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A site/ data/
          git commit -m "Actualiza eventos $(date -u +%F)" || echo "sin cambios"
          git pull --rebase origin main || true
          git push
      - name: Avisar si alguna fuente falla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > alerts.txt
          import json; h = json.load(open("data/health.json")); print("\n".join("- " + a for a in h.get("alerts", [])))
          PY
          if [ -s alerts.txt ]; then
            title="Alerta de fuentes $(date -u +%F)"
            if ! gh issue list --state open --search "in:title \"Alerta de fuentes\"" --json number --jq 'length' | grep -qv '^0$'; then
              gh issue create --title "$title" --body "$(printf 'Fuentes con menos eventos de lo normal o con error:\n\n%s\n\nRevisa data/health.json y el log del workflow.' "$(cat alerts.txt)")"
            else
              echo "Ya hay una alerta abierta; no se duplica."
            fi
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
