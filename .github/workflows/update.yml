name: Actualizar planes y publicar

on:
  schedule:
    - cron: "15 4 * * *"   # todos los días a las 04:15 UTC
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: planika-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

