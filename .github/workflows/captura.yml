name: Capturas para reels (rama sondeo, no desplegar)
on:
  push:
    branches: [sondeo]
    paths: ["tools/sondeo/captura.py", ".github/workflows/captura.yml"]
permissions:
  contents: write
jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q fonts-roboto fonts-noto-color-emoji >/dev/null
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Capturas anteriores
        run: git clone -q --depth 1 -b capturas "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" capturas || mkdir capturas
      - run: python3 tools/sondeo/captura.py
        env:
          REELS: miplan,misplanes,idiomas
      - name: Subir las capturas a la rama capturas
        run: |
          cd capturas
          [ -d .git ] || git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas $(date -u +%FT%TZ)"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:capturas
