name: Prueba de versiones de acciones Node 24 (rama sondeo, no desplegar)
on:
  push:
    branches: [sondeo]
    paths: [".github/workflows/prueba_acciones.yml"]
permissions:
  contents: read
  pages: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arreglo-avisos-actions
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v6
        continue-on-error: true
      - run: |
          for a in deploy-pages:v5 upload-pages-artifact:v5 configure-pages:v6 upload-artifact:v6 download-artifact:v7 checkout:v5 setup-python:v6; do
            r=${a%%:*}; t=${a##*:}
            echo "$r@$t -> $(git ls-remote https://github.com/actions/$r refs/tags/$t | cut -c1-12)"
            curl -fsSL "https://raw.githubusercontent.com/actions/$r/$t/action.yml" | grep -E "using:|uses:" | sed "s/^/   $r@$t /"
          done
          mkdir -p /tmp/sitio && echo '<html></html>' > /tmp/sitio/index.html
          python3 tools/seo_check.py site | grep -c "unsubscribe" || echo "sin error de unsubscribe"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/sitio
          name: prueba-pages
      - uses: actions/upload-artifact@v6
        with:
          name: prueba
          path: /tmp/sitio
          retention-days: 1
  descarga:
    needs: prueba
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: prueba
          path: sitio
      - run: ls -la sitio
